# RELEASE PR VALIDATION WORKFLOW
# This workflow validates PRs targeting release branches before they can be merged.
# It automatically bumps the patch version if needed, runs the full validation
# pipeline, and adds a comment with release information.
#
# Required for branch protection status checks on:
# - release/angular-3d
# - release/angular-gsap

name: Release PR Validation

on:
  pull_request:
    branches:
      - 'release/angular-3d'
      - 'release/angular-gsap'

permissions:
  contents: write # Required to push version bump commits
  pull-requests: write

jobs:
  # Job 0: Skip if triggered by bot commit (prevent infinite loop)
  check-trigger:
    runs-on: ubuntu-latest
    outputs:
      should_run: ${{ steps.check.outputs.should_run }}
    steps:
      - name: Check if triggered by bot
        id: check
        shell: bash
        run: |
          if [[ "${{ github.event.head_commit.author.name }}" == "github-actions[bot]" ]]; then
            echo "Skipping workflow - triggered by bot commit"
            echo "should_run=false" >> $GITHUB_OUTPUT
          else
            echo "should_run=true" >> $GITHUB_OUTPUT
          fi

  # Job 1: Auto-bump version if it matches the published npm version
  auto-version-bump:
    needs: check-trigger
    if: needs.check-trigger.outputs.should_run == 'true'
    runs-on: ubuntu-latest
    outputs:
      package_name: ${{ steps.detect.outputs.package_name }}
      package_path: ${{ steps.detect.outputs.package_path }}
      version: ${{ steps.final-version.outputs.version }}
      npm_version: ${{ steps.version.outputs.npm_version }}
      was_bumped: ${{ steps.bump.outputs.was_bumped }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref }}
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Detect target package
        id: detect
        shell: bash
        run: |
          TARGET_BRANCH="${{ github.base_ref }}"
          case "$TARGET_BRANCH" in
            "release/angular-3d")
              echo "package_name=@hive-academy/angular-3d" >> $GITHUB_OUTPUT
              echo "package_path=libs/angular-3d" >> $GITHUB_OUTPUT
              ;;
            "release/angular-gsap")
              echo "package_name=@hive-academy/angular-gsap" >> $GITHUB_OUTPUT
              echo "package_path=libs/angular-gsap" >> $GITHUB_OUTPUT
              ;;
          esac

      - name: Get version info
        id: version
        shell: bash
        run: |
          CURRENT=$(node -p "require('./${{ steps.detect.outputs.package_path }}/package.json').version")
          echo "current_version=$CURRENT" >> $GITHUB_OUTPUT

          # Check npm for published versions
          NPM_LATEST=$(npm view "${{ steps.detect.outputs.package_name }}" version 2>/dev/null || echo "0.0.0")
          echo "npm_version=$NPM_LATEST" >> $GITHUB_OUTPUT

      - name: Auto-bump patch version if needed
        id: bump
        shell: bash
        run: |
          CURRENT="${{ steps.version.outputs.current_version }}"
          NPM="${{ steps.version.outputs.npm_version }}"

          echo "Current package.json version: $CURRENT"
          echo "Latest npm version: $NPM"

          if [ "$CURRENT" = "$NPM" ]; then
            echo "Version matches npm, auto-bumping patch version..."
            cd ${{ steps.detect.outputs.package_path }}
            npm version patch --no-git-tag-version
            NEW_VERSION=$(node -p "require('./package.json').version")
            echo "Bumped version to: $NEW_VERSION"
            echo "was_bumped=true" >> $GITHUB_OUTPUT
            echo "new_version=$NEW_VERSION" >> $GITHUB_OUTPUT
          else
            echo "Version $CURRENT is already different from npm ($NPM), no bump needed"
            echo "was_bumped=false" >> $GITHUB_OUTPUT
          fi

      - name: Commit and push version bump
        if: steps.bump.outputs.was_bumped == 'true'
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add ${{ steps.detect.outputs.package_path }}/package.json
          git commit -m "chore(release): bump ${{ steps.detect.outputs.package_name }} to ${{ steps.bump.outputs.new_version }}"
          git push

      - name: Get final version
        id: final-version
        shell: bash
        run: |
          VERSION=$(node -p "require('./${{ steps.detect.outputs.package_path }}/package.json').version")
          echo "version=$VERSION" >> $GITHUB_OUTPUT

  # Job 2: Validate the release PR (runs after version bump)
  validate-release-pr:
    needs: auto-version-bump
    if: needs.auto-version-bump.result == 'success'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref }}
          fetch-depth: 0

      - name: Pull latest changes
        shell: bash
        run: |
          # Ensure we have the latest commit (including any version bump from Job 1)
          git pull origin ${{ github.head_ref }} --ff-only || true

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Install dependencies
        shell: bash
        run: npm ci

      - name: Get current version from file
        id: current-version
        shell: bash
        run: |
          # Read version directly from file to ensure we have the latest
          VERSION=$(node -p "require('./${{ needs.auto-version-bump.outputs.package_path }}/package.json').version")
          echo "version=$VERSION" >> $GITHUB_OUTPUT

      - name: Validate version is ready for publish
        shell: bash
        run: |
          VERSION="${{ steps.current-version.outputs.version }}"
          NPM="${{ needs.auto-version-bump.outputs.npm_version }}"
          WAS_BUMPED="${{ needs.auto-version-bump.outputs.was_bumped }}"

          echo "Version to publish: $VERSION"
          echo "Current npm version: $NPM"
          echo "Was auto-bumped: $WAS_BUMPED"

          if [ "$VERSION" = "$NPM" ]; then
            echo "::error::Version $VERSION still matches npm. This should not happen after auto-bump."
            exit 1
          fi

          echo "✓ Version $VERSION is valid for publishing"

      - name: Run full validation
        shell: bash
        run: |
          echo "::group::Linting"
          npx nx run-many -t lint
          echo "::endgroup::"

          echo "::group::Testing"
          npx nx run-many -t test
          echo "::endgroup::"

          echo "::group::Type Checking"
          npx nx run-many -t typecheck
          echo "::endgroup::"

          echo "::group::Building"
          npx nx run-many -t build
          echo "::endgroup::"

      - name: Validate build output
        shell: bash
        run: |
          DIST_PATH="dist/${{ needs.auto-version-bump.outputs.package_path }}"

          if [[ ! -d "$DIST_PATH" ]]; then
            echo "::error::Build output not found"
            exit 1
          fi

          echo "Build artifacts validated"

      - name: Add PR comment with release info
        uses: actions/github-script@v7
        with:
          script: |
            const version = '${{ steps.current-version.outputs.version }}';
            const package_name = '${{ needs.auto-version-bump.outputs.package_name }}';
            const npm_version = '${{ needs.auto-version-bump.outputs.npm_version }}';
            const was_bumped = '${{ needs.auto-version-bump.outputs.was_bumped }}';

            const bumpNote = was_bumped === 'true'
              ? `\n> **Note:** Version was automatically bumped from \`${npm_version}\` to \`${version}\`\n`
              : '';

            const body = `## 🚀 Release Validation Passed
            ${bumpNote}
            | Property | Value |
            |----------|-------|
            | **Package** | \`${package_name}\` |
            | **Version to Publish** | \`${version}\` |
            | **Current npm Version** | \`${npm_version}\` |

            ### Pre-Publish Checklist
            - [x] Version bump validated (auto-bumped: ${was_bumped})
            - [x] Lint validation passed
            - [x] Tests passed
            - [x] Type checking passed
            - [x] Build successful

            ### What happens on merge?
            1. Package will be published to npm with provenance
            2. Git tag \`${package_name}@${version}\` will be created
            3. GitHub Release will be created

            **Merge this PR to publish to npm.**`;

            github.rest.issues.createComment({
              issue_number: context.issue.number,
              owner: context.repo.owner,
              repo: context.repo.repo,
              body: body
            });
